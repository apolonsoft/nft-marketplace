[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
cache_path = "cache"
out = "out"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
bytecode_hash = "none"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"

[profile.anvil]
chain_id = 31337

[profile.base-sepolia]
chain_id = 84532

[profile.ci]
fuzz = { runs = 256 }
verbosity = 3

remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }
