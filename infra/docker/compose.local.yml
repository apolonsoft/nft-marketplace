name: nft-marketplace-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nft_marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports: ['5432:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      {
        test: ['CMD-SHELL', 'pg_isready -U marketplace -d nft_marketplace'],
        interval: 5s,
        timeout: 5s,
        retries: 20,
      }
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    volumes: [redis-data:/data]
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 5s, timeout: 3s, retries: 20 }
  kubo:
    image: ipfs/kubo:v0.34.1
    command: ['daemon', '--migrate=true', '--enable-pubsub-experiment']
    volumes: [kubo-data:/data/ipfs]
    ports: ['5001:5001', '8080:8080']
    healthcheck:
      {
        test: ['CMD-SHELL', 'wget --post-data="" -qO- http://127.0.0.1:5001/api/v0/id >/dev/null'],
        interval: 10s,
        timeout: 5s,
        retries: 20,
      }
  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    entrypoint: []
    command:
      [
        'anvil',
        '--host',
        '0.0.0.0',
        '--chain-id',
        '31337',
        '--block-time',
        '1',
        '--state',
        '/root/.foundry/anvil-state.json',
      ]
    volumes: [anvil-data:/root/.foundry]
    ports: ['8545:8545']
    healthcheck:
      {
        test: ['CMD-SHELL', 'cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null'],
        interval: 5s,
        timeout: 5s,
        retries: 20,
      }
volumes:
  postgres-data:
  redis-data:
  kubo-data:
  anvil-data:
