api:
  dashboard: false
entryPoints:
  web: { address: ':80' }
  websecure: { address: ':443' }
providers:
  docker: { exposedByDefault: false }
certificatesResolvers:
  letsencrypt:
    acme:
      email: ${ACME_EMAIL}
      storage: /letsencrypt/acme.json
      httpChallenge: { entryPoint: web }
http:
  middlewares:
    security:
      headers: { contentTypeNosniff: true, frameDeny: true, browserXssFilter: true, stsSeconds: 31536000 }
    rate-limit:
      rateLimit: { average: 100, burst: 200 }
    redirect-https:
      redirectScheme: { scheme: https, permanent: true }
